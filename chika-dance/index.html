<style>

  --accent:#149E95; --accent-ink:#0B5F5B; --pink:#E25D96; --chip:#E3F2F1; --chip-on:#149E95; --chip-on-fg:#FFFFFF;
  --display:"M PLUS Rounded 1c","Noto Sans SC","WenQuanYi Zen Hei",system-ui,sans-serif;
  --body:"Noto Sans SC","M PLUS Rounded 1c","WenQuanYi Zen Hei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1618; --fg:#E4EFF0; --muted:#90A6AA; --panel:#15201F; --line:#25373A; --accent:#3BD0C5; --accent-ink:#A6EFE9; --pink:#F27BB0; --chip:#1C2F32; --chip-on:#3BD0C5; --chip-on-fg:#0E1618; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#0E1618; --fg:#E4EFF0; --muted:#90A6AA; --panel:#15201F; --line:#25373A; --accent:#3BD0C5; --accent-ink:#A6EFE9; --pink:#F27BB0; --chip:#1C2F32; --chip-on:#3BD0C5; --chip-on-fg:#0E1618; color-scheme:dark }

<main class="wrap">

</main>

<script>
(() => {
'use strict';
// ===================== constants & helpers =====================
const W = 1280, H = 720;
const BPM = 128, BEAT = 60 / BPM, TOTAL_BEATS = 128, DURATION = TOTAL_BEATS * BEAT; // 60 s
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, s) => a + (b - a) * s;
const fract = v => v - Math.floor(v);
const smooth = s => { s = clamp(s, 0, 1); return s * s * (3 - 2 * s); };
const hop = (u, h) => (u < 0 || u > 1) ? 0 : h * 4 * u * (1 - u);
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const lerpAngle = (a, b, s) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return a + d * s; };
const asin = Math.abs;

// ===================== rig dimensions =====================
const HEAD_R = 64, NECK = 10, TORSO = 92, SHW = 66, HIPW = 40, UARM = 56, FARM = 54;
const THIGH = 66, SHIN = 64, STANCE = 22, TAILL = 300;
const LEG_STAND = THIGH + SHIN - 2;
const GROUND = 606;
const BLEND = 0.75; // beats of cross-fade between sections

const C = {
  line: '#2A2E3A', skin: '#FFE8D8', skinShade: '#F2C8B4',
  hair: '#3FC9BF', hairDark: '#27A89F', hairLight: '#96EDE6', hairLine: '#1B7F78',
  top: '#C3CBD0', topShade: '#9AA4AA', tie: '#39C5BB', collar: '#2E3340',
  skirt: '#2F3340', trim: '#39C5BB', sleeve: '#33363F', boot: '#33363F',
  eye: '#2DBAB0', eyeDark: '#12706A', mouth: '#C8445F', tongue: '#F48FA6',
  dark: '#2E3138', pinkAcc: '#E9538F', blush: '255,118,140'
};

// ===================== choreography =====================
const SECTIONS = [
  { id: 'intro',   cn: '登场',     en: 'Intro',       start: 0,   len: 8 },
  { id: 'point',   cn: '指尖闪烁', en: 'Chika point', start: 8,   len: 16 },
  { id: 'hips',    cn: '叉腰扭胯', en: 'Hip shake',   start: 24,  len: 16 },
  { id: 'roll',    cn: '绕拳甩臂', en: 'Fist roll',   start: 40,  len: 16 },
  { id: 'wave',    cn: '举手摆荡', en: 'Pendulum',    start: 56,  len: 16 },
  { id: 'spin',    cn: '转身回眸', en: 'Spin',        start: 72,  len: 8 },
  { id: 'cheek',   cn: '托腮卖萌', en: 'Cheeks',      start: 80,  len: 16 },
  { id: 'step',    cn: '侧步拍手', en: 'Side step',   start: 96,  len: 16 },
  { id: 'reprise', cn: '再来一次', en: 'Reprise',     start: 112, len: 12 },
  { id: 'final',   cn: '定格',     en: 'Final pose',  start: 124, len: 4 },
];

// Arm specs. Coordinates are "outward": +x points away from the body's centre line,
// relative to the shoulder, in the torso's own frame. T = IK target, A = explicit angles.
const T = (x, y, hand = 'fist', finger = null, elbow = 1) => ({ target: { x, y }, hand, finger, elbow });
const A = (up, lo, hand = 'fist', finger = null) => ({ up, lo, hand, finger });
// TB = target given in body screen-space (sx = screen x of the hand relative to the body centre).
const TB = (sx, y, side, hand = 'fist', finger = null, elbow = 1) => T(side * sx - SHW / 2, y - 4, hand, finger, elbow);

function baseSpec() {
  return {
    cx: 0, dip: 10, jump: 0, travel: 0, lean: 0, yaw: 0, hipTilt: 0, headTilt: 0, headYaw: 0, headNod: 0,
    feet: { l: { x: 0, y: 0 }, r: { x: 0, y: 0 } },
    arms: { l: A(0.18, 0.3), r: A(0.18, 0.3) }, armZ: 'front',
    expr: 'smile', blush: 0.5, look: 0,
  };
}
const beatDip = (b, base, amp) => base - amp * asin(Math.sin(PI * b)); // lowest on the beat

const MOVES = {
  intro(b) {
    const p = baseSpec();
    p.dip = beatDip(b, 14, 6);
    p.cx = 5 * Math.sin(PI * b / 2);
    p.lean = -0.05 * Math.sin(PI * b / 2);
    p.headTilt = 0.06 * Math.sin(PI * b / 2);
    p.headNod = 2 * Math.sin(TAU * b);
    p.arms.l = T(-27, 50); p.arms.r = T(-27, 50);
    if (b >= 6) { p.expr = 'wink'; p.headTilt = 0.16; p.arms.r = T(13, -38, 'point', 2.9); p.look = -0.4; }
    return p;
  },
  point(b) {
    const p = baseSpec();
    const S = Math.cos(PI * b), w = Math.sin(PI * b);
    p.cx = 16 * S; p.lean = -0.13 * S; p.headTilt = 0.12 * S; p.look = S * 0.6;
    p.dip = beatDip(b, 16, 10);
    p.feet.l.x = 6; p.feet.r.x = 6;
    p.arms.l = T(19, -42 + 14 * w, 'point', 2.85);
    p.arms.r = T(19, -42 - 14 * w, 'point', 2.85);
    p.expr = (Math.floor(b / 4) % 2 === 0) ? 'open' : 'smile';
    return p;
  },
  hips(b) {
    const p = baseSpec();
    const S = Math.cos(PI * b);
    p.cx = 22 * S; p.lean = -0.2 * S; p.hipTilt = 0.1 * S; p.headTilt = 0.07 * S; p.yaw = -0.18 * S; p.look = -S * 0.4;
    p.dip = beatDip(b, 18, 8);
    p.feet.l.x = 14; p.feet.r.x = 14;
    p.arms.l = T(-4, 86); p.arms.r = T(-4, 86);
    if (b >= 12) p.lean += 0.07 * Math.sin(4 * PI * b);
    p.expr = 'grin';
    return p;
  },
  roll(b) {
    const p = baseSpec();
    const bar = Math.floor(b / 4), q = b - bar * 4;
    p.dip = beatDip(b, 14, 8); p.cx = 6 * Math.sin(PI * b);
    if (q < 3) {
      const th = TAU * b;
      p.arms.l = T(18 * Math.cos(th) - 33, 42 + 18 * Math.sin(th));
      p.arms.r = T(-18 * Math.cos(th) - 33, 42 - 18 * Math.sin(th));
      p.headNod = 2 * Math.sin(TAU * b); p.expr = 'smile';
    } else {
      const v = q - 3;
      if (bar % 2 === 0) { p.arms.l = T(70, -70, 'open'); p.arms.r = T(70, -70, 'open'); }
      else {
        const d = bar === 1 ? 1 : -1;
        const far = T(57, -49, 'open'), cross = T(-78, -79, 'open');
        if (d > 0) { p.arms.l = far; p.arms.r = cross; } else { p.arms.l = cross; p.arms.r = far; }
        p.lean = 0.12 * d; p.headTilt = 0.1 * d; p.cx = 10 * d; p.look = 0.5 * d;
      }
      p.jump = hop(v, 24); p.feet.l.y = p.jump * 0.25; p.feet.r.y = p.jump * 0.25;
      p.expr = 'open'; p.dip = 8;
    }
    return p;
  },
  wave(b) {
    const p = baseSpec();
    p.feet.l.x = 10; p.feet.r.x = 10;
    if (b < 12) {
      const sg = Math.sin(PI * b), sig = 0.42 * sg, V = PI - 0.55;
      p.arms.l = A(V - sig, V - sig - 0.15, 'open');
      p.arms.r = A(V + sig, V + sig - 0.15, 'open');
      p.cx = -16 * sg; p.lean = 0.16 * sg; p.headTilt = 0.22 * sg; p.look = sg * 0.5;
      p.dip = beatDip(b, 12, 6); p.expr = 'open';
    } else {
      const v = (b - 12) / 4, ang = TAU * v;
      p.arms.l = A(PI - ang, PI - ang - 0.2, 'open');
      p.arms.r = A(PI - ang, PI - ang - 0.2, 'open');
      p.dip = beatDip(b, 16, 10); p.expr = 'grin'; p.cx = 10 * Math.sin(TAU * v); p.headTilt = -0.1 * Math.sin(TAU * v);
    }
    return p;
  },
  spin(b) {
    const p = baseSpec();
    p.feet.l.x = 4; p.feet.r.x = 4;
    if (b < 2) {
      p.yaw = PI * smooth(b / 2);
      p.arms.l = A(0.7, 0.9, 'open'); p.arms.r = A(0.7, 0.9, 'open');
      p.dip = 12; p.expr = 'open'; p.headYaw = 0.3 * Math.sin(PI * b / 2);
    } else if (b < 6) {
      const S = Math.cos(PI * b);
      p.yaw = PI; p.cx = 20 * S; p.lean = -0.18 * S; p.hipTilt = 0.1 * S;
      p.dip = beatDip(b, 18, 8);
      p.arms.l = T(-19, 72); p.arms.r = T(-19, 72); p.armZ = 'back';
      const pk = smooth((b - 4) / 0.6);
      p.headYaw = -1.85 * pk; p.headTilt = 0.18 * pk; p.expr = 'wink'; p.look = -0.6;
    } else {
      const v = (b - 6) / 2;
      p.yaw = PI + PI * smooth(v); p.jump = hop(v, 18);
      p.arms.l = A(2.2, 2.4, 'open'); p.arms.r = A(2.2, 2.4, 'open');
      p.expr = 'open'; p.dip = 10;
    }
    return p;
  },
  cheek(b) {
    const p = baseSpec();
    const S = Math.sin(PI * b / 2);
    p.dip = beatDip(b, 16, 10); p.cx = 10 * S; p.lean = -0.06 * S; p.headTilt = 0.3 * S; p.look = S * 0.5;
    p.feet.l.x = 10; p.feet.r.x = 10; p.blush = 1;
    if (b < 8 || b >= 12) {
      p.arms.l = T(-7, -24); p.arms.r = T(-7, -24);
      p.expr = (Math.floor(b / 2) % 2) ? 'oo' : 'open';
      if (b >= 14) p.expr = 'wink';
    } else {
      const w = Math.sin(4 * PI * b);
      p.arms.l = T(25, -30 + 6 * w, 'open'); p.arms.r = T(25, -30 - 6 * w, 'open'); p.expr = 'grin';
    }
    return p;
  },
  step(b) {
    const p = baseSpec();
    const bar = Math.floor(b / 4), q = b - bar * 4;
    let tr; if (q < 1) tr = 40 * smooth(q); else if (q < 2) tr = 40; else if (q < 3) tr = 40 * (1 - smooth(q - 2)); else tr = 0;
    p.travel = tr;
    const lift = ph => (ph >= 0 && ph < 1) ? 11 * Math.sin(PI * ph) : 0;
    if (q < 1) { p.feet.l.y = lift(q * 2); p.feet.r.y = lift(q * 2 - 1); }
    else if (q >= 2 && q < 3) { p.feet.r.y = lift((q - 2) * 2); p.feet.l.y = lift((q - 2) * 2 - 1); }
    p.dip = beatDip(b, 14, 6); p.feet.l.x += 4; p.feet.r.x += 4;
    if (q < 1) { p.arms.l = TB(60, 30, 1, 'open'); p.arms.r = TB(30, 50, -1, 'open'); p.lean = 0.1; p.look = 0.5; }
    else if (q < 2) {
      const v = smooth((q - 1) / 0.4);
      p.arms.l = TB(lerp(60, 7, v), lerp(30, 40, v), 1, 'open');
      p.arms.r = TB(lerp(30, -7, v), lerp(50, 40, v), -1, 'open');
      p.lean = 0.05 * (1 - v); p.expr = 'open';
    } else if (q < 3) { p.arms.l = TB(-30, 50, 1, 'open'); p.arms.r = TB(-60, 30, -1, 'open'); p.lean = -0.1; p.look = -0.5; }
    else {
      const v = smooth((q - 3) / 0.4);
      const ul = ik2(-30 - SHW / 2, 46, UARM, FARM, 1), ur = ik2(60 - SHW / 2, 26, UARM, FARM, 1);
      p.arms.l = A(lerp(ul[0], PI - 0.7, v), lerp(ul[1], PI - 0.95, v), 'open');
      p.arms.r = A(lerp(ur[0], PI - 0.7, v), lerp(ur[1], PI - 0.95, v), 'open'); p.expr = 'grin';
      p.lean = -0.05 * (1 - v);
    }
    if (bar === 3 && q >= 2) {
      p.arms.l = TB(84, -40, 1, 'point'); p.arms.r = TB(40, -62, -1, 'point');
      p.expr = 'wink'; p.lean = 0.15; p.headTilt = 0.15; p.cx = 12; p.look = 0.6; p.feet.l.y = 0; p.feet.r.y = 0; p.travel = 0;
    }
    return p;
  },
  reprise(b) {
    const p = baseSpec();
    const S = Math.cos(PI * b), w = Math.sin(PI * b);
    p.cx = 18 * S; p.lean = -0.14 * S; p.headTilt = 0.14 * S; p.look = S * 0.6;
    p.dip = beatDip(b, 16, 10); p.feet.l.x = 8; p.feet.r.x = 8;
    if (b < 8) {
      const u = b - Math.floor(b / 4) * 4;
      p.jump = hop(u / 0.8, 22); p.feet.l.y = p.jump * 0.3; p.feet.r.y = p.jump * 0.3;
      p.arms.l = T(36, -92 + 16 * w, 'point', 2.7); p.arms.r = T(36, -92 - 16 * w, 'point', 2.7);
      p.expr = (Math.floor(b / 2) % 2) ? 'open' : 'grin';
    } else {
      const v = (b - 8) / 4, ang = TAU * v;
      p.arms.l = A(PI - ang, PI - ang - 0.2, 'open'); p.arms.r = A(PI - ang, PI - ang - 0.2, 'open');
      p.expr = 'open'; p.cx = 14 * Math.sin(TAU * v); p.headTilt = -0.12 * Math.sin(TAU * v);
    }
    return p;
  },
  final(b) {
    const p = baseSpec();
    const u = clamp(b, 0, 1.5), snap = 1 - Math.exp(-5 * u) * Math.cos(9 * u);
    p.cx = -18 * snap; p.lean = 0.14 * snap; p.headTilt = -0.22 * snap; p.hipTilt = -0.1 * snap; p.yaw = -0.12 * snap;
    p.dip = 13 + 2 * Math.sin(TAU * b / 2);
    p.feet.l.x = 16; p.feet.r.x = 6;
    p.arms.l = T(-4, 86); p.arms.r = T(7, -34, 'peace', 2.6);
    p.expr = 'wink'; p.blush = 0.8; p.look = 0.1;
    return p;
  },
};

// ===================== IK & solving =====================
function ik2(tx, ty, L1, L2, e) {
  let d = Math.hypot(tx, ty);
  const maxd = L1 + L2 - 0.5, mind = Math.abs(L1 - L2) + 0.5;
  if (d > maxd) { tx *= maxd / d; ty *= maxd / d; d = maxd; }
  if (d < mind) { if (d < 1e-6) { tx = 0; ty = mind; } else { tx *= mind / d; ty *= mind / d; } d = mind; }
  const a0 = Math.atan2(tx, ty);
  const c = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1), phi = Math.acos(c);
  // two mirror solutions; prefer the joint on side e (screen x), and slightly prefer the lower one
  let best = null, bestScore = -Infinity;
  for (const a1 of [a0 + phi, a0 - phi]) {
    const ex = L1 * Math.sin(a1), ey = L1 * Math.cos(a1);
    const score = e * ex + 0.3 * ey;
    if (score > bestScore) { bestScore = score; best = [a1, Math.atan2(tx - ex, ty - ey)]; }
  }
  return best;
}
function resolveArm(spec, side, sgn) {
  const m = side * sgn; let up, lo;
  if (spec.target) { [up, lo] = ik2(m * spec.target.x, spec.target.y, UARM, FARM, m * (spec.elbow ?? 1)); }
  else { up = m * spec.up; lo = m * spec.lo; }
  return { up, lo, hand: spec.hand || 'fist', finger: spec.finger == null ? null : m * spec.finger };
}
function resolveSpec(p) {
  const sgn = Math.cos(p.yaw) >= 0 ? 1 : -1;
  p.armsR = { l: resolveArm(p.arms.l, 1, sgn), r: resolveArm(p.arms.r, -1, sgn) };
  return p;
}

muteBtn.addEventListener('click', () => { muted = !muted; if (audio) audio.gain.gain.value = muted ? 0 : 0.9; try { localStorage.setItem('miku-chika-muted', muted ? '1' : '0'); } catch (e) { /* ignore */ } updateUi(now()); });
scrub.addEventListener('input', () => { scrubbing = true; const t = parseFloat(scrub.value); tCur = t; draw(t); timeEl.textContent = `${fmt(t)} / ${fmt(DURATION)}`; });
scrub.addEventListener('change', () => { scrubbing = false; seek(parseFloat(scrub.value)); });
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|BUTTON|TEXTAREA/.test(e.target.tagName) && e.code !== 'Space') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') seek(now() + 2); else if (e.code === 'ArrowLeft') seek(now() - 2);
});
SECTIONS.forEach((s, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.id = `chip-${s.id}`; b.setAttribute('role', 'listitem');
  b.innerHTML = `<b>${String(i + 1).padStart(2, '0')}</b>${s.cn}`; b.title = `${s.en} · ${fmt(s.start * BEAT)}`;
  b.addEventListener('click', () => { if (playing) startAt(s.start * BEAT); else seek(s.start * BEAT, false); });
  chips.appendChild(b);
});
scrub.max = String(DURATION);
window.addEventListener('resize', () => { if (!playing) draw(tCur); });

// Offline rendering hooks (used by render.mjs to produce the MP4).
window.__prepareRender = (w, h) => { canvas.width = w; canvas.height = h; canvas.style.width = w + 'px'; canvas.style.height = h + 'px'; };
window.__renderFrame = t => { ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0); renderFrame(ctx, t); return canvas.toDataURL('image/png').split(',')[1]; };
window.__renderWav = (sr = 44100) => { const bytes = new Uint8Array(wavFromFloat(synthSong(sr), sr)); let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };

function start(data) { tCur = clamp(+(data && data.t) || 0, 0, DURATION); ended = tCur >= DURATION; updateUi(tCur); draw(tCur); }
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ t: now() }));
(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
